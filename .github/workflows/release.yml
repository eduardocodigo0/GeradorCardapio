name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 'enhanced' uses Gradle's commercial caching service; 'basic' only
          # uses the GitHub Actions cache, which is enough for this project.
          cache-provider: basic

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/GeradorCardapio-${{ steps.meta.outputs.tag }}-debug.apk"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ steps.meta.outputs.tag }}
          path: dist/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GeradorCardapio ${{ steps.meta.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Debug build of GeradorCardapio (not signed with a release key).

            **Install:** download the `.apk` below, allow "install unknown apps"
            for your browser/file manager, then open the file.
